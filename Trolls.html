            if(link==0.5){window.location.href="https://hackertyper.net/"}
            if(link==0.6){idk()}
            if(link==0.7){idk()}
            if(link==0.8){idk()}
            if(link==0.9){idk()}
            if(link==1){idk()}
            //----
        }
        document.getElementById("idk").addEventListener("click",idk)
